# Project manifest. Toolchain is uv (ADR-002).
#   uv sync            -> create .venv and install locked deps
#   uv run <cmd>       -> run inside the project environment
[project]
name = "hippo-pipeline"
version = "0.1.0"
description = "Pharmacy claims & reverts data pipeline producing auditable PBM metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Ost" }]

# Runtime dependencies are EMPTY, permanently, by ADR-009: the pipeline is implemented
# against the standard library only. Adding one here requires an ADR that supersedes
# ADR-009 - and scripts/lint_architecture.py will fail the build until it exists.
# Third-party packages belong in the dev group below, or in a spike run via
# `uv run --with <pkg>`, which leaves this manifest untouched.
dependencies = []

[project.scripts]
hippo = "hippo_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-bdd>=7.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hippo_pipeline"]

# ---------------------------------------------------------------- pytest ----
# Two tiers (ADR-004). Markers let CI gate them separately.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["src"]
bdd_features_base_dir = "tests/bdd/features"
addopts = "-q --strict-markers"
markers = [
  "system: system-behavior tier - real files/IO, baseline-gated, not a merge gate",
]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
exclude = ["tests/fixtures"]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "T20", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# cli.py is the ONE module allowed to print - stdout is a CLI's interface, and
# scripts/lint_architecture.py enforces that no other module does it. Ruff's blanket T20
# would otherwise force the architecture rule to be violated to satisfy the linter.
"src/hippo_pipeline/cli.py" = ["T20"]
# scripts/ are developer CLI tools: printing to stdout IS their interface, and they are
# not imported by the package. Everything else applies - the architectural linter is a
# merge gate and has no business being unlinted.
"scripts/*" = ["T20", "ANN"]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = ["tests/fixtures/"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

# Tests stay strict about the code they exercise, not about their own fixtures. Annotating
# every helper and every pytest fixture buys nothing: their types are obvious at the call
# site and the assertions are the specification.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/hippo_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
